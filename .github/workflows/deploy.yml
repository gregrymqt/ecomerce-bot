name: Deploy E-commerce Bot to VPS

on:
  push:
    branches:
      - main # Dispara o deploy em todo push na branch main

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH na VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            
            # 1. Navega até a pasta do projeto na VPS
            cd /opt/ecommerce-bot
            
            # 2. Atualiza o código-fonte
            git pull origin main
            
            # 3. Atualiza o arquivo .env.prod no caminho correto da infraestrutura
            echo "${{ secrets.PROD_ENV_FILE }}" > infra/prod/.env.prod
            
            # 4. Executa build e sobe os contêineres atualizados
            docker compose -f infra/prod/docker-compose.prod.yml --env-file infra/prod/.env.prod up -d --build --remove-orphans
            
            # 5. Aplica as migrations do banco de dados (Alembic) no Supabase
            docker compose -f infra/prod/docker-compose.prod.yml exec -T api alembic upgrade head
            
            # 6. Limpa imagens órfãs para economizar espaço de disco na VPS
            docker image prune -f