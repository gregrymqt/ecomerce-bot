name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-dotnet:
    name: Backend (.NET Build & Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore & build EcommerceBot.Core
        run: |
          dotnet restore EcommerceBot.Core/EcommerceBot.Core.sln
          dotnet build EcommerceBot.Core/EcommerceBot.Core.sln --no-restore -c Release

      - name: Run EcommerceBot.Core unit tests
        run: dotnet test EcommerceBot.Core/EcommerceBot.Core.sln --no-build -c Release --verbosity minimal

      - name: Build Database.Migrations (DbUp)
        run: dotnet build Database.Migrations/Database.Migrations.csproj -c Release

  worker-python:
    name: Worker (Python Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: EcommerceBot.Worker/requirements.txt

      - name: Install dependencies and run pytest
        working-directory: EcommerceBot.Worker
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio mcp
          pytest -q

  web-frontend:
    name: Frontend (Lint, Vitest & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: EcommerceBot.Web/package-lock.json

      - name: Install, lint, test, and build Web SPA
        working-directory: EcommerceBot.Web
        run: |
          npm ci
          npm run lint
          npm run test
          npm run build
