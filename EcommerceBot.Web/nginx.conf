server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Habilita compressão Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # =========================================================================
    # CABEÇALHOS DE SEGURANÇA HTTP (HARDENING)
    # =========================================================================
    # Bloqueia a renderização do site dentro de <iframe/frame> (Prevenção contra Clickjacking)
    add_header X-Frame-Options "DENY" always;

    # Força o navegador a respeitar o Content-Type declarado (Prevenção contra MIME-Sniffing)
    add_header X-Content-Type-Options "nosniff" always;

    # Controla as informações de origem enviadas no cabeçalho Referer
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Restringe recursos de hardware do navegador (Câmera, Microfone, Geolocalização)
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Força conexões HTTPS por 1 ano incluindo subdomínios (HSTS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Content Security Policy (CSP) Restritiva para Produção
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:; object-src 'none'; frame-ancestors 'none';" always;

    # Roteamento SPA (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache estático agressivo para assets compilados com cabeçalhos mantidos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    error_page 500 502 503 504 /5x.html;
    location = /5x.html {
        root /usr/share/nginx/html;
    }
}