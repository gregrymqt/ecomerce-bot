server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Habilita compressão Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # =========================================================================
    # CABEÇALHOS DE SEGURANÇA HTTP (HARDENING)
    # =========================================================================
    # Bloqueia a renderização do site dentro de <iframe/frame> (Prevenção contra Clickjacking)
    add_header X-Frame-Options "DENY" always;

    # Força o navegador a respeitar o Content-Type declarado (Prevenção contra MIME-Sniffing)
    add_header X-Content-Type-Options "nosniff" always;

    # Controla as informações de origem enviadas no cabeçalho Referer
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Restringe recursos de hardware do navegador (Câmera, Microfone, Geolocalização)
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Força conexões HTTPS por 1 ano incluindo subdomínios (HSTS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://sdk.mercadopago.com https://http2.mlstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: https://*.mercadopago.com https://http2.mlstatic.com; font-src 'self' data: https://fonts.gstatic.com https://http2.mlstatic.com; connect-src 'self' http: https: ws: wss: https://api.mercadopago.com https://*.mercadopago.com; frame-src 'self' https://*.mercadopago.com https://sdk.mercadopago.com; object-src 'none'; frame-ancestors 'none';" always;

    # Roteamento SPA (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Evita cache do index.html para entrega imediata de novas versões após deploy
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Cache estático imutável para bundles Vite com hash de compilação (/assets/)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Cache estático para imagens, ícones e fontes
    location ~* \.(ico|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    error_page 500 502 503 504 /5x.html;
    location = /5x.html {
        root /usr/share/nginx/html;
    }
}