services:
  redis:
    image: redis:alpine
    container_name: redis-bot
    ports:
      - "6379:6379"
    restart: always
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes # Garante persistência dos dados de cache em disco

  api:
    build: .
    container_name: ecommerce-bot-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
    restart: always

volumes:
  redis-data: