<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Meta Tags Básicas -->
    <title>E-Commerce AutoBot - Extração e Enriquecimento de Catálogos com IA</title>
    <meta name="description" content="Plataforma inteligente para extração automática, enriquecimento via IA e exportação/sincronização de catálogos de produtos de e-commerce." />
    
    <!-- Google Search Console Verification -->
    <meta name="google-site-verification" content="%VITE_GSC_VERIFICATION_TOKEN%" />
    
    <!-- Hardening Básico via Meta Tags -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    
    <!-- Fallback CSP para Desenvolvimento Local (no Docker/Prod o Nginx assume a prioridade) -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' ws: wss: http: https:;"
    />

    <!-- Favicon e Ícones -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Otimização de Fontes Web (Preconexão DNS/TLS) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Open Graph / Facebook / WhatsApp / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="E-Commerce AutoBot - Extração e Enriquecimento de Catálogos com IA" />
    <meta property="og:description" content="Plataforma inteligente para extração automática, enriquecimento via IA e exportação/sincronização de catálogos de produtos de e-commerce." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://ecommercebot.com" />
    <meta property="og:site_name" content="E-Commerce AutoBot" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="E-Commerce AutoBot - Extração e Enriquecimento de Catálogos com IA" />
    <meta name="twitter:description" content="Plataforma inteligente para extração automática, enriquecimento via IA e exportação/sincronização de catálogos de produtos de e-commerce." />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
