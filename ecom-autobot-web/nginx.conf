server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Habilita compressão Gzip para alta performance no carregamento
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Roteamento SPA (Single Page Application) - React Router DOM
    # Redireciona todas as rotas para index.html para não dar 404 no F5/refresh
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache estático agressivo para assets compilados (JS, CSS, imagens, fontes)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /5x.html;
    location = /5x.html {
        root /usr/share/nginx/html;
    }
}
