<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Atenção: Falha de Integração</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #0f172a; color: #f8fafc; padding: 20px;">
    <div style="max-width: 600px; margin: 0 auto; background: #1e293b; padding: 24px; border-radius: 8px; border: 1px solid #ef4444;">
        <h2 style="color: #ef4444;">Atenção: Falha na Integração 🚨</h2>
        <p style="color: #cbd5e1;">Detectamos um erro de comunicação ou credenciais inválidas na sua conta (<code>{{ tenant_id }}</code>).</p>
        <p style="color: #cbd5e1;"><strong>Plataforma / Provedor:</strong> {{ platform or provider }}</p>
        <p style="color: #cbd5e1;"><strong>Detalhe do Erro:</strong> {{ error_detail or error_message }}</p>
        <div style="margin-top: 24px; text-align: center;">
            <a href="https://app.ecommercebot.com/settings/integrations" style="background-color: #ef4444; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; font-weight: bold;">Revisar Integração</a>
        </div>
    </div>
</body>
</html>
