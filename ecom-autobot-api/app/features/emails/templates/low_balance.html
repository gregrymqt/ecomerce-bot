<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Alerta de Saldo Baixo</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #0f172a; color: #f8fafc; padding: 20px;">
    <div style="max-width: 600px; margin: 0 auto; background: #1e293b; padding: 24px; border-radius: 8px; border: 1px solid #eab308;">
        <h2 style="color: #eab308;">Atenção: Saldo de Créditos Baixo ⚠️</h2>
        <p style="color: #cbd5e1;">Olá {{ user_name }}, o saldo de créditos da sua organização (<code>{{ tenant_id }}</code>) está próximo do fim.</p>
        <p style="color: #cbd5e1;"><strong>Saldo Restante:</strong> <span style="color: #f43f5e; font-weight: bold;">{{ current_balance }} créditos</span></p>
        <p style="color: #cbd5e1;">Para evitar interrupções nas rotinas de automação e IA, recarregue seu saldo.</p>
        <div style="margin-top: 24px; text-align: center;">
            <a href="https://app.ecommercebot.com/subscriptions?action=recharge" style="background-color: #eab308; color: #0f172a; padding: 12px 24px; text-decoration: none; border-radius: 6px; font-weight: bold;">Recarregar Créditos</a>
        </div>
    </div>
</body>
</html>
