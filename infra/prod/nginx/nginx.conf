events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    client_max_body_size 25M;

    # ⚡ Compressão Gzip na Borda (Otimização de Largura de Banda & TTFB)
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # =========================================================================
    # UPSTREAMS DO ECOSSISTEMA E-COMMERCE BOT
    # =========================================================================
    upstream core_api {
        server api:8080;
        keepalive 32;
    }

    upstream web_frontend {
        server web:80;
        keepalive 16;
    }

    # 🛡️ Zonas de Rate Limiting na Borda (Nginx Edge Protection)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=120r/m;
    limit_req_status 429;

    # =========================================================================
    # 1. Bloco HTTP (Porta 80) - Desafios ACME / Certbot + Redirecionamento HTTPS
    # =========================================================================
    server {
        listen 80;
        server_name _;

        # Validação do Certbot para emissão/renovação de certificado SSL
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redireciona todo o tráfego HTTP restante para HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================================================================
    # 2. Bloco HTTPS (Porta 443) - Criptografia SSL/TLS de Produção
    # =========================================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # Certificados SSL (Symlink Let's Encrypt quando SSL_DOMAIN existe ou fallback autoassinado no boot)
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # Parâmetros de Segurança SSL Recomendados (TLS 1.2 / 1.3 apenas)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Cabeçalhos de Segurança Globais (Hardening)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # 🚀 Rotas Especiais para SSE (Server-Sent Events) - Stream em tempo real sem buffering
        location ~* ^/api/v1/(demo/stream|system/demo/stream|stream)$ {
            proxy_pass http://core_api;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Desativa o buffering para entrega em tempo real
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_set_header X-Accel-Buffering "no";
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 💳 Webhooks (Mercado Pago, Recargas IA, Shopify, Nuvemshop, Resend) - Sem rate limit agressivo de IP
        location ~* ^/api/v1/(webhooks/mercadopago|webhooks/ai-credits|shopify/webhooks|nuvemshop/webhooks|emails/webhooks)$ {
            proxy_pass http://core_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            client_max_body_size 10M;
        }

        # 🔒 Rotas públicas sensíveis de autenticação com Rate Limiting estrito na borda (preserva /auth/me e /refresh)
        location ~* ^/api/v1/auth/(login|register|forgot-password|reset-password|google/(login|callback))$ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://core_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ⚡ Rotas de API Central (.NET 9 Core API)
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://core_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 🩺 Healthcheck da API Core
        location /health {
            proxy_pass http://core_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 🌐 Rota Raiz - Frontend Web SPA (React 18 + Vite)
        location / {
            proxy_pass http://web_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}