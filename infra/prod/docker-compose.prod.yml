services:
  # Banco de Dados PostgreSQL 16 local na VPS
  postgres:
    image: postgres:16-alpine
    container_name: prod-postgres-bot
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prod_postgres_password_secure}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce_bot_db}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
    networks:
      - internal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ecommerce_bot_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis de Alta Performance local na VPS
  redis:
    image: redis:7-alpine
    container_name: prod-redis-bot
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-prod_redis_password_secure}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    volumes:
      - redis-prod-data:/data
    networks:
      - internal-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-prod_redis_password_secure}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Broker de Mensageria RabbitMQ local na VPS
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: prod-rabbitmq-bot
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-prod_rabbitmq_password_secure}
    ports:
      - "127.0.0.1:15672:15672" # Painel Web de Gestão protegido no localhost da VPS
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    volumes:
      - rabbitmq-prod-data:/var/lib/rabbitmq
    networks:
      - internal-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # API FastAPI Backend & Worker Pool
  api:
    build:
      context: ../../ecom-autobot-api
      dockerfile: Dockerfile
    container_name: prod-api-bot
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CORS_ORIGINS=${CORS_ORIGINS:-["*"]}
      - POSTGRES_URI=${POSTGRES_URI:-postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-prod_postgres_password_secure}@postgres:5432/${POSTGRES_DB:-ecommerce_bot_db}}
      - POSTGRES_URI_TRANSACTION=${POSTGRES_URI_TRANSACTION}
      - POSTGRES_URI_SESSION=${POSTGRES_URI_SESSION}
      - DB_SSL_CERT_PATH=${DB_SSL_CERT_PATH}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-prod_rabbitmq_password_secure}@rabbitmq:5672/}
      - REDIS_URL=${REDIS_URL:-redis://:${REDIS_PASSWORD:-prod_redis_password_secure}@redis:6379/0}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-prod_redis_password_secure}
      - AES_MASTER_KEY=${AES_MASTER_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - MERCADOPAGO_ACCESS_TOKEN=${MERCADOPAGO_ACCESS_TOKEN}
      - MERCADOPAGO_WEBHOOK_SECRET=${MERCADOPAGO_WEBHOOK_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      - LOW_BALANCE_THRESHOLD=${LOW_BALANCE_THRESHOLD:-10}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2048M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - internal-net

  # Reverse Proxy Nginx com suporte a SSL e SSE
  nginx:
    image: nginx:alpine
    container_name: prod-nginx-bot
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - api
    networks:
      - internal-net

  # Certbot - Automação de Renovação de SSL
  certbot:
    image: certbot/certbot
    container_name: prod-certbot-bot
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while true; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  internal-net:
    driver: bridge

volumes:
  postgres-prod-data:
  redis-prod-data:
  rabbitmq-prod-data:
  certbot-etc:
  certbot-var:
  certbot-www: