services:
  # ==============================================================================
  # 1. BANCO DE DADOS & INFRAESTRUTURA BASE
  # ==============================================================================

  # Banco de Dados Microsoft SQL Server 2022 em Docker/Linux
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: prod-mssql-bot
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-prod_mssql_password_secure}
      MSSQL_PID: ${MSSQL_PID:-Developer}
      MSSQL_AGENT_ENABLED: "true"
    ports:
      - "127.0.0.1:1433:1433" # Acesso seguro restrito ao localhost (Túnel SSH / DBeaver / Azure Data Studio)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 3072M
    volumes:
      - mssql-prod-data:/var/opt/mssql/data
      - mssql-prod-backup:/var/opt/mssql/backup
    networks:
      - internal-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD:-prod_mssql_password_secure}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Redis de Alta Performance (Cache & SSE Pub/Sub)
  redis:
    image: redis:7-alpine
    container_name: prod-redis-bot
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-prod_redis_password_secure}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    volumes:
      - redis-prod-data:/data
    networks:
      - internal-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-prod_redis_password_secure}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Broker de Mensageria RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: prod-rabbitmq-bot
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-prod_rabbitmq_password_secure}
    ports:
      - "127.0.0.1:15672:15672" # Painel Web de Gestão protegido no localhost da VPS
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    volumes:
      - rabbitmq-prod-data:/var/lib/rabbitmq
    networks:
      - internal-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # 2. RUNNER DE MIGRAÇÕES DETERMINÍSTICAS (DbUp .NET 9)
  # ==============================================================================
  migrations:
    build:
      context: ../../Database.Migrations
      dockerfile: Dockerfile
    container_name: prod-migrations-bot
    env_file:
      - path: .env.prod
        required: false
      - path: ../../.env
        required: false
    environment:
      - MSSQL_CONNECTION_STRING=${MSSQL_CONNECTION_STRING:-${ConnectionStrings__DefaultConnection:-Server=mssql,1433;Database=EcommerceBotDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-prod_mssql_password_secure};TrustServerCertificate=True;Encrypt=False;}}
      - ConnectionStrings__DefaultConnection=${ConnectionStrings__DefaultConnection:-${MSSQL_CONNECTION_STRING:-Server=mssql,1433;Database=EcommerceBotDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-prod_mssql_password_secure};TrustServerCertificate=True;Encrypt=False;}}
    depends_on:
      mssql:
        condition: service_healthy
    networks:
      - internal-net
    profiles:
      - tools
      - migration

  # ==============================================================================
  # 3. API CENTRAL (.NET 9 C# - Clean Architecture & Dapper)
  # ==============================================================================
  api:
    build:
      context: ../../EcommerceBot.Core
      dockerfile: Dockerfile
    container_name: prod-api-bot
    restart: unless-stopped
    env_file:
      - path: .env.prod
        required: false
      - path: ../../.env
        required: false
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=${ConnectionStrings__DefaultConnection:-${MSSQL_CONNECTION_STRING:-Server=mssql,1433;Database=EcommerceBotDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-prod_mssql_password_secure};TrustServerCertificate=True;Encrypt=False;}}
      - MSSQL_CONNECTION_STRING=${MSSQL_CONNECTION_STRING:-${ConnectionStrings__DefaultConnection:-Server=mssql,1433;Database=EcommerceBotDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-prod_mssql_password_secure};TrustServerCertificate=True;Encrypt=False;}}
      - ConnectionStrings__Redis=${ConnectionStrings__Redis:-${Redis__ConnectionString:-redis:6379,password=${REDIS_PASSWORD:-prod_redis_password_secure},abortConnect=false}}
      - Redis__ConnectionString=${Redis__ConnectionString:-${ConnectionStrings__Redis:-redis:6379,password=${REDIS_PASSWORD:-prod_redis_password_secure},abortConnect=false}}
      - Redis__Password=${REDIS_PASSWORD:-prod_redis_password_secure}
      - RabbitMQ__Host=${RabbitMQ__Host:-rabbitmq}
      - RabbitMQ__Username=${RabbitMQ__Username:-${RABBITMQ_USER:-guest}}
      - RabbitMQ__Password=${RabbitMQ__Password:-${RABBITMQ_PASS:-prod_rabbitmq_password_secure}}
      - RabbitMQ__Port=5672
      - Jwt__Key=${Jwt__Key:-${JWT_SECRET_KEY}}
      - Jwt__Issuer=${Jwt__Issuer:-EcommerceBotApi}
      - Jwt__Audience=${Jwt__Audience:-EcommerceBotClient}
      - Security__AesMasterKey=${Security__AesMasterKey:-${AES_MASTER_KEY}}
      - Security__InternalServiceKey=${Security__InternalServiceKey:-${INTERNAL_SERVICE_KEY:-}}
      - Security__SuperAdminEmails=${ADMIN_EMAILS:-${Security__SuperAdminEmails:-admin@ecommercebot.com}}
      - MercadoPago__AccessToken=${MercadoPago__AccessToken:-${MERCADOPAGO_ACCESS_TOKEN}}
      - MercadoPago__WebhookSecret=${MercadoPago__WebhookSecret:-${MERCADOPAGO_WEBHOOK_SECRET}}
      - MercadoPago__PublicKey=${MercadoPago__PublicKey:-${MERCADOPAGO_PUBLIC_KEY:-${VITE_MERCADOPAGO_PUBLIC_KEY:-}}}
      - Resend__ApiKey=${Resend__ApiKey:-${RESEND_API_KEY}}
      - Resend__DeliveryMode=${Resend__DeliveryMode:-${RESEND_DELIVERY_MODE:-Live}}
      - Resend__FromEmail=${EMAIL_FROM:-${Resend__FromEmail:-${DEFAULT_FROM_EMAIL:-ECom AutoBot <notificacoes@ecommercebot.com>}}}
      - Resend__Enabled=${Resend__Enabled:-${RESEND_ENABLED:-true}}
      - Discord__WebhookUrl=${Discord__WebhookUrl:-${DISCORD_WEBHOOK_URL}}
      - Discord__Enabled=true
      - Shopify__ClientId=${Shopify__ClientId:-${SHOPIFY_CLIENT_ID}}
      - Shopify__ClientSecret=${Shopify__ClientSecret:-${SHOPIFY_CLIENT_SECRET}}
      - Shopify__WebhookSecret=${Shopify__WebhookSecret:-${SHOPIFY_WEBHOOK_SECRET}}
      - Nuvemshop__ClientId=${Nuvemshop__ClientId:-${NUVEMSHOP_CLIENT_ID}}
      - Nuvemshop__ClientSecret=${Nuvemshop__ClientSecret:-${NUVEMSHOP_CLIENT_SECRET}}
      - Nuvemshop__WebhookSecret=${Nuvemshop__WebhookSecret:-${NUVEMSHOP_WEBHOOK_SECRET}}
      - Google__ClientId=${Google__ClientId:-${GOOGLE_CLIENT_ID:-}}
      - Google__ClientSecret=${Google__ClientSecret:-${GOOGLE_CLIENT_SECRET:-}}
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
    depends_on:
      mssql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - internal-net

  # ==============================================================================
  # 4. AI/ML ENGINE & WORKER POOL (Python - Sem acesso a DB)
  # ==============================================================================
  worker:
    build:
      context: ../../EcommerceBot.Worker
      dockerfile: Dockerfile
    container_name: prod-worker-bot
    restart: unless-stopped
    env_file:
      - path: .env.prod
        required: false
      - path: ../../.env
        required: false
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CORS_ORIGINS=${CORS_ORIGINS:-["*"]}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-prod_rabbitmq_password_secure}@rabbitmq:5672/}
      - REDIS_URL=${REDIS_URL:-redis://:${REDIS_PASSWORD:-prod_redis_password_secure}@redis:6379/0}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-prod_redis_password_secure}
      - AES_MASTER_KEY=${AES_MASTER_KEY:-${Security__AesMasterKey}}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-${Jwt__Key}}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:-${Security__InternalServiceKey:-}}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - MERCADOPAGO_ACCESS_TOKEN=${MERCADOPAGO_ACCESS_TOKEN:-${MercadoPago__AccessToken:-}}
      - MERCADOPAGO_WEBHOOK_SECRET=${MERCADOPAGO_WEBHOOK_SECRET:-${MercadoPago__WebhookSecret:-}}
      - RESEND_API_KEY=${RESEND_API_KEY:-${Resend__ApiKey:-}}
      - DEFAULT_FROM_EMAIL=${EMAIL_FROM:-${Resend__FromEmail:-${DEFAULT_FROM_EMAIL:-ECom AutoBot <notificacoes@ecommercebot.com>}}}
      - LOW_BALANCE_THRESHOLD=${LOW_BALANCE_THRESHOLD:-10}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-${Discord__WebhookUrl:-}}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-${App__BaseUrl:-https://api.ecommercebot.com}}
      - FRONTEND_URL=${FRONTEND_URL:-${App__FrontendUrl:-https://app.ecommercebot.com}}
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2048M
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - internal-net

  # ==============================================================================
  # 5. FRONTEND WEB SPA (React 18 + Vite + Nginx)
  # ==============================================================================
  web:
    build:
      context: ../../EcommerceBot.Web
      dockerfile: Dockerfile
    container_name: prod-web-bot
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - internal-net

  # ==============================================================================
  # 6. REVERSE PROXY & GATEWAY DE BORDA (Nginx + SSL + SSE)
  # ==============================================================================
  nginx:
    image: nginx:alpine
    container_name: prod-nginx-bot
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - api
      - web
      - worker
    networks:
      - internal-net

  # ==============================================================================
  # 7. CERTBOT (Renovação Automática de Certificados SSL Let's Encrypt)
  # ==============================================================================
  certbot:
    image: certbot/certbot
    container_name: prod-certbot-bot
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while true; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  internal-net:
    driver: bridge

volumes:
  mssql-prod-data:
  mssql-prod-backup:
  redis-prod-data:
  rabbitmq-prod-data:
  certbot-etc:
  certbot-var:
  certbot-www: