services:
  # Redis de Alta Performance local na VPS
  redis:
    image: redis:7-alpine
    container_name: prod-redis-bot
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-prod_redis_password_secure}
    volumes:
      - redis-prod-data:/data
    networks:
      - internal-net

  # API FastAPI Backend & Worker Pool
  api:
    build:
      context: ../../ecom-autobot-api
      dockerfile: Dockerfile
    container_name: prod-api-bot
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-prod_redis_password_secure}@redis:6379/0
      - ENVIRONMENT=production
    depends_on:
      - redis
    networks:
      - internal-net

  # Reverse Proxy Nginx com suporte a SSE sem buffer
  nginx:
    image: nginx:alpine
    container_name: prod-nginx-bot
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
    depends_on:
      - api
    networks:
      - internal-net

networks:
  internal-net:
    driver: bridge

volumes:
  redis-prod-data:
  certbot-etc:
  certbot-var:
