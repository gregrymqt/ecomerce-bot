services:
  # Redis de Alta Performance local na VPS
  redis:
    image: redis:7-alpine
    container_name: prod-redis-bot
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-prod_redis_password_secure}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    volumes:
      - redis-prod-data:/data
    networks:
      - internal-net

  # API FastAPI Backend & Worker Pool
  api:
    build:
      context: ../../ecom-autobot-api
      dockerfile: Dockerfile
    container_name: prod-api-bot
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CORS_ORIGINS=${CORS_ORIGINS:-["*"]}
      - POSTGRES_URI=${POSTGRES_URI}
      - POSTGRES_URI_TRANSACTION=${POSTGRES_URI_TRANSACTION}
      - POSTGRES_URI_SESSION=${POSTGRES_URI_SESSION}
      - DB_SSL_CERT_PATH=${DB_SSL_CERT_PATH:-prod-ca-2021.crt}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - REDIS_URL=${REDIS_URL:-redis://:${REDIS_PASSWORD:-prod_redis_password_secure}@redis:6379/0}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-prod_redis_password_secure}
      - AES_MASTER_KEY=${AES_MASTER_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - MERCADOPAGO_ACCESS_TOKEN=${MERCADOPAGO_ACCESS_TOKEN}
      - MERCADOPAGO_WEBHOOK_SECRET=${MERCADOPAGO_WEBHOOK_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      - LOW_BALANCE_THRESHOLD=${LOW_BALANCE_THRESHOLD:-10}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2048M
    depends_on:
      - redis
    networks:
      - internal-net

  # Reverse Proxy Nginx com suporte a SSL e SSE
  nginx:
    image: nginx:alpine
    container_name: prod-nginx-bot
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - api
    networks:
      - internal-net

  # Certbot - Automação de Renovação de SSL
  certbot:
    image: certbot/certbot
    container_name: prod-certbot-bot
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while true; do certbot renew; sleep 12h & wait $${!}; done;'"

  # -----------------------------------------------------------------
  # 🚀 Opcional: Escalonamento Standalone de Workers em Containers Separados
  # Descomente abaixo para desacoplar a execução do worker de e-mails da API principal:
  # -----------------------------------------------------------------
  # worker-email:
  #   build:
  #     context: ../../ecom-autobot-api
  #     dockerfile: Dockerfile
  #   container_name: prod-worker-email-bot
  #   restart: unless-stopped
  #   command: python -m app.features.emails.workers.email_worker
  #   env_file:
  #     - .env.prod
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: '0.5'
  #         memory: 512M
  #   depends_on:
  #     - redis
  #   networks:
  #     - internal-net

networks:
  internal-net:
    driver: bridge

volumes:
  redis-prod-data:
  certbot-etc:
  certbot-var:
  certbot-www: