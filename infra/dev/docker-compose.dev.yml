services:
  postgres:
    image: postgres:16-alpine
    container_name: dev-postgres-bot
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ecommerce_bot_db
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_bot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: dev-redis-bot
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-dev-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: dev-rabbitmq-bot
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management Web UI
    restart: unless-stopped
    volumes:
      - rabbitmq-dev-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../../ecom-autobot-api
      dockerfile: Dockerfile
    container_name: dev-api-bot
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=["*"]
      - POSTGRES_URI=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/ecommerce_bot_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - REDIS_URL=redis://redis:6379/0
      - AES_MASTER_KEY=ZGV2X2Flc19tYXN0ZXJfa2V5XzMyYnl0ZXNfZGV2IQ==
      - JWT_SECRET_KEY=dev_jwt_secret_key_for_local_testing_32bytes!
      - DEEPSEEK_API_KEY=sk-dummy-deepseek-key-dev
      - GROQ_API_KEY=gsk-dummy-groq-key-dev
      - OPENAI_API_KEY=sk-dummy-openai-key-dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../../ecom-autobot-web
      dockerfile: Dockerfile
    container_name: dev-web-bot
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-dev-data:
  redis-dev-data:
  rabbitmq-dev-data:
