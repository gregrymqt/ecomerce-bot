services:
  postgres:
    image: postgres:16-alpine
    container_name: dev-postgres-bot
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ecommerce_bot_db
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: dev-redis-bot
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-dev-data:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: dev-rabbitmq-bot
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management Web UI
    restart: unless-stopped
    volumes:
      - rabbitmq-dev-data:/var/lib/rabbitmq

volumes:
  postgres-dev-data:
  redis-dev-data:
  rabbitmq-dev-data:
