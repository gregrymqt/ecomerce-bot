services:

  redis:
    image: redis:alpine
    container_name: dev-redis-bot
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-dev-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: dev-rabbitmq-bot
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management Web UI
    restart: unless-stopped
    volumes:
      - rabbitmq-dev-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5



  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dev-mssql-bot
    user: root # 👈 ADICIONE ESTA LINHA AQUI
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-YourStrong@Passw0rdDev}"
      MSSQL_PID: "${MSSQL_PID:-Developer}"
      MSSQL_AGENT_ENABLED: "true"
    ports:
      - "1433:1433"
    restart: unless-stopped
    volumes:
      - mssql-dev-data:/var/opt/mssql/data
      - mssql-dev-backup:/var/opt/mssql/backup
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD:-YourStrong@Passw0rdDev}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  redis-dev-data:
  rabbitmq-dev-data:
  mssql-dev-data:
  mssql-dev-backup:
